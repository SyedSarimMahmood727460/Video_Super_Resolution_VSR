[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsr-mahti"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "tqdm",
  "scikit-image",
  "imageio",
  "imageio-ffmpeg",
  "streamlit>=1.28.0",
  "pandas>=2.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = ["vsr"]
